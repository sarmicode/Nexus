version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/farmbridge
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=docker_dev_secret_change_in_production_32chars
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=7d
      - ADMIN_PHONE=9876543210
      - ADMIN_PASSWORD=Admin@1234
      - CORS_ORIGIN=http://localhost:5173,http://localhost
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
